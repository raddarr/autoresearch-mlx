name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Syntax check
        run: uv run python -m py_compile prepare.py train.py tests/test_prepare.py scripts/bench_dataloader.py
      - name: Unit tests
        run: uv run python -m unittest discover -s tests
